    environment:
      SANDBOX_API_URL: http://sandbox-api:8090
      FILESYSTEM_API_URL: http://filesystem-api:8091
    networks:
      - default
      - bot-tools
  opensandbox-server:
    networks:
      - default
      - bot-tools

networks:
  bot-tools:
    name: bot-tools-mcp
    external: true
