name: bot-manager-prd

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file:
      - ${PRD_ENV_FILE:-../.env.prd}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    profiles: [tools]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: build-env
    env_file:
      - ${PRD_ENV_FILE:-../.env.prd}
    command: ["npx", "prisma", "db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.prd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prd}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.prd}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app-data:
  postgres-data:
